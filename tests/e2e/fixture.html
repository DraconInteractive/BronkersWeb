<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bronkers test fixture</title></head><body><div id="app"></div><script type="module">
import { Game } from '/src/engine/game.ts';
import { mountApp } from '/src/ui/app.ts';
import { cards } from '/tests/cards.ts';
import '/src/style.css';
import { attachRoundLogging } from '/src/telemetry/roundLogging.ts';
const game = new Game(undefined,undefined,[],{mode:new URLSearchParams(location.search).get('mode')==='points'?'points':'goals'});
if(new URLSearchParams(location.search).has('points-final')) {game.roundNumber=10;game.scores=[new URLSearchParams(location.search).has('tie')?24:20,25];}
game.human.hand = cards('5H 5S 5D 8H 8S 8D 5C');
game.deck.cards = cards('KH');
if (new URLSearchParams(location.search).has('final')) game.human.goals.forEach((goal,i) => { goal.completed = i !== 0; });
if (new URLSearchParams(location.search).has('crowded')) {
 const ai = game.players[1]; ai.goal = ai.goals[9]; ai.laidDown = true;
 ai.goal.formations.slice(0,2).forEach((f,i) => f.trySet(cards(Array(8).fill(i ? '8H' : '5H').join(' '))));
 ai.goal.formations.slice(2).forEach(f => {
   f.trySet(cards('AH 2C 3H 4H 5H 6H 7H 8H 9H 10H JH QH KH'));
   f.tryAdd(cards('AH')[0]);
 });
}
if (new URLSearchParams(location.search).has('round-ai')) {
 const ai=game.players[1]; ai.goal=ai.goals[0]; ai.laidDown=true; ai.goal.completed=true;
 ai.goal.formations[0].trySet(cards('5H 5S 5D'));
 ai.goal.formations[1].trySet(cards('8H 8S 8D'));
 ai.hand=cards('KH'); game.deck.cards=cards('5C'); game.discardPile=cards('3C');
 if (new URLSearchParams(location.search).has('both')) {
   game.human.goal=game.human.goals[0]; game.human.laidDown=true; game.human.goal.completed=true;
   game.human.goal.formations[0].trySet(cards('3H 3S 3D'));
   game.human.goal.formations[1].trySet(cards('4H 4S 4D'));
 }
 game.activePlayer=1;
}
if (new URLSearchParams(location.search).has('opponent-count')) {
 const ai=game.players[1];
 const incomplete = new URLSearchParams(location.search).has('incomplete');
 ai.goal=ai.goals[incomplete ? 1 : 0];
 // Isolate header behaviour from AI reward tuning with one unfinished goal.
 ai.goals.forEach(goal => { goal.completed = goal !== ai.goal; });
 ai.hand=cards('5H 5S 5D 8H 8S 8D KH QC JS 10D 9H 7S 6C');
 game.deck.cards=cards('3C');game.discardPile=cards('4D');game.activePlayer=1;
}
if(new URLSearchParams(location.search).has('layout-cards')) {
 game.human.goal=game.human.goals[9];
 ['5H 5S 5D','8H 8S 8D','3C 4C 5C 6C','9S 10S JS QS'].forEach((text,i)=>game.human.goal.formations[i].trySet(cards(text)));
 game.human.refreshCanLayDown();
}
mountApp(document.querySelector('#app'),game);
if(new URLSearchParams(location.search).has('logging'))attachRoundLogging(game,{buildCommit:'development'});
if (['round-ai','opponent-count'].some(key=>new URLSearchParams(location.search).has(key))) void game.processAITurn();
</script></body></html>
